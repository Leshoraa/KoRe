name: Full Model Validation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Minimum-Jerk Kinematics NRMSE and R^2
        run: |
          python3 scripts/validate_kinematics.py

      - name: Compile and Run C++ Unit Tests
        run: |
          g++ -std=c++17 -I . tests/unit/test_minimum_jerk.cpp -o test_jerk && ./test_jerk
          g++ -std=c++17 -I . src/math/kore_kalman.cpp tests/unit/test_kalman_convergence.cpp -o test_kalman && ./test_kalman
          g++ -std=c++17 -I . tests/unit/test_affective_langevin.cpp -o test_affective && ./test_affective
          g++ -std=c++17 -I . tests/unit/test_kinematics_feedforward.cpp -o test_kinematics && ./test_kinematics
          g++ -std=c++17 -I . tests/unit/test_brain_inference.cpp -o test_brain && ./test_brain
          g++ -std=c++17 -I . src/ai/kore_memory.cpp tests/unit/test_episodic_memory.cpp -o test_mem && ./test_mem
          g++ -std=c++17 -I . tests/unit/test_personality_circadian.cpp -o test_personality && ./test_personality
          g++ -std=c++17 -I . tests/unit/test_vision_habituation.cpp -o test_hab && ./test_hab
